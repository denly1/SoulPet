name: soulpet
description: "SoulPet — AI Virtual Pet Companion App"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.2.3

  # Local storage
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Network
  dio: ^5.4.0
  retrofit: ^4.0.0

  # Form validation
  formz: ^0.8.0

  # Functional programming
  dartz: ^0.10.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.4.0
  get_it: ^9.2.1
  injectable: ^3.0.0

  # UI
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Liquid Glass (iOS 26 style)
  liquid_glass_widgets: ^0.12.2

  # Chat bubbles (iMessage shape)
  chat_bubbles: ^1.9.0

  # 3D Model viewer
  flutter_3d_controller: ^2.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  injectable_generator: ^3.0.2
  retrofit_generator: ^10.2.6
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/pets/
    - assets/models/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
